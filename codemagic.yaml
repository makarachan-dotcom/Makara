workflows:
  # ─────────────────────────────────────────────
  # 1. Run on every push / PR — analyze + test
  # ─────────────────────────────────────────────
  flutter-test:
    name: Analyze & Test
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Install dependencies
        script: flutter pub get

      - name: Static analysis
        script: flutter analyze --no-fatal-infos

      - name: Run tests
        script: flutter test --coverage

    artifacts:
      - coverage/lcov.info

  # ─────────────────────────────────────────────
  # 2. Android build (APK + AAB)
  # ─────────────────────────────────────────────
  android-build:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      groups:
        - google_credentials  # Add GCLOUD_SERVICE_ACCOUNT_CREDENTIALS in Codemagic UI
      vars:
        PACKAGE_NAME: "com.makara.makara_premium_app"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
        - pattern: 'release/*'
          include: true
    scripts:
      - name: Install dependencies
        script: flutter pub get

      - name: Run tests
        script: flutter test

      - name: Build APK (release)
        script: flutter build apk --release

      - name: Build AAB (release)
        script: flutter build appbundle --release

    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - ddddcccc1060@gmail.com
        notify:
          success: true
          failure: true
      # Uncomment below after adding Google Play credentials in Codemagic UI:
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      #   submit_as_draft: true

  # ─────────────────────────────────────────────
  # 3. Web build (deploy to Codemagic static pages)
  # ─────────────────────────────────────────────
  web-build:
    name: Web Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
        - pattern: 'release/*'
          include: true
    scripts:
      - name: Install dependencies
        script: flutter pub get

      - name: Run tests
        script: flutter test

      - name: Build Web (release)
        script: |
          flutter build web --release
          cd build/web
          zip -r ../../makara_web.zip .

    artifacts:
      - build/web/**
      - makara_web.zip

    publishing:
      email:
        recipients:
          - ddddcccc1060@gmail.com
        notify:
          success: true
          failure: true

  # ─────────────────────────────────────────────
  # 4. iOS build (IPA)
  # ─────────────────────────────────────────────
  ios-build:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Makara App Store  # Set up in Codemagic UI → Integrations
    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.makara.makaraPremiumApp
      vars:
        BUNDLE_ID: "com.makara.makaraPremiumApp"
        APP_STORE_APP_ID: "000000000"  # Replace with actual App Store ID
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
        - pattern: 'release/*'
          include: true
    scripts:
      - name: Install dependencies
        script: flutter pub get

      - name: Run tests
        script: flutter test

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build IPA
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - ddddcccc1060@gmail.com
        notify:
          success: true
          failure: true
      # Uncomment after setting up App Store Connect integration:
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
      #   beta_groups:
      #     - Internal Testers
