name: makara_premium_app
description: "Premium productivity & alarm app by Makara - ម៉ាការ៉ា"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Camera & ML
  camera: ^0.11.1
  google_mlkit_face_detection: ^0.12.0

  # Audio
  just_audio: ^0.9.43
  audio_service: ^0.18.17
  just_audio_background: ^0.0.1-beta.14

  # Storage
  shared_preferences: ^2.3.4
  sqflite: ^2.4.2
  path: ^1.9.1

  # Firebase
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.5

  # Biometric Auth
  local_auth: ^2.3.0

  # HTTP
  http: ^1.3.0

  # UI Components
  fl_chart: ^0.70.2
  percent_indicator: ^4.2.3
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  lottie: ^3.3.1

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Date/Time
  intl: ^0.20.2

  # UUID
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/

  fonts:
    - family: Battambang
      fonts:
        - asset: assets/fonts/Battambang-Regular.ttf
        - asset: assets/fonts/Battambang-Bold.ttf
          weight: 700
        - asset: assets/fonts/Battambang-Light.ttf
          weight: 300
